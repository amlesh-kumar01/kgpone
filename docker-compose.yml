

services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: kgpone-backend:latest
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis:6379/1

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      - redis
    command: sh -c "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic
      - ./backend/models:/app/models
      - hf_cache:/root/.cache/huggingface

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: kgpone-backend:latest
    command: celery -A src.workers.app.celery_app worker --loglevel=info
    env_file:
      - ./backend/.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis:6379/1

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      - redis
    volumes:
      - ./backend/src:/app/src
      - ./backend/models:/app/models
      - hf_cache:/root/.cache/huggingface

volumes:
  redis_data:
  hf_cache:
