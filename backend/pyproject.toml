[project]
name = "backend"
version = "0.1.0"
description = "KnowledgeOS Backend powered by FastAPI, LangGraph and FastMCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.6",
    "fastmcp>=0.4.1",
    "langchain>=0.3.0",
    "langgraph>=0.2.14",
    "boto3>=1.35.0",
    "qdrant-client>=1.11.1",
    "neo4j>=5.24.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.34",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
]
