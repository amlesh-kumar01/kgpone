[project]
name = "backend"
version = "0.1.0"
description = "KnowledgeOS Backend powered by FastAPI, LangGraph and FastMCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.6",
    "fastmcp>=0.4.1",
    "langchain>=0.3.0",
    "langgraph>=0.2.14",
    "boto3>=1.35.0",
    "qdrant-client>=1.11.1",
    "neo4j>=5.24.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.34",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "docling>=2.97.0",
    "pymupdf>=1.27.2.3",
    "google-genai>=2.8.0",
    "google-generativeai>=0.8.6",
    "llama-parse>=0.6.94",
    "fastapi-csrf-protect>=1.0.7",
    "slowapi>=0.1.9",
    "passlib>=1.7.4",
    "bcrypt>=5.0.0",
    "python-jose>=3.5.0",
    "celery>=5.4.0",
    "redis>=5.0.4",
    "alembic>=1.18.4",
    "argon2-cffi>=25.1.0",
]

[tool.pyright]
include = ["src", "alembic"]
executionEnvironments = [
  { root = "." }
]
